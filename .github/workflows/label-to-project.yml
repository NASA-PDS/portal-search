name: Label-based Project Management

on:
  workflow_call:
    inputs:
      issue_number:
        description: 'Issue number'
        required: true
        type: number
      repository:
        description: 'Repository name (org/repo format)'
        required: true
        type: string
      label_name:
        description: 'Label that was added or removed'
        required: true
        type: string
      action:
        description: 'Action: labeled or unlabeled'
        required: true
        type: string
    secrets:
      gh_token:
        description: 'GitHub token with project write permissions'
        required: true

# Caller-supplied inputs (label_name, repository, issue_number) are attacker-influenced
# text. They are passed to steps only through `env:` and read as quoted shell variables;
# they are never interpolated into `run:` scripts with `${{ }}`.
jobs:
  handle-label:
    runs-on: ubuntu-latest
    name: Handle label-based project automation

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          repository: NASA-PDS/.github
          sparse-checkout: |
            .github/scripts
            conf
          sparse-checkout-cone-mode: false

      - name: Process build label
        if: inputs.action == 'labeled' && startsWith(inputs.label_name, 'B') && inputs.label_name != 'bug'
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
          REPOSITORY: ${{ inputs.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          LABEL_NAME: ${{ inputs.label_name }}
        run: |
          # Only build labels (B followed by digits) are processed; mirrors BUILD_LABEL_RE
          # in project_automation.py. Anything else is ignored, as the script would do.
          if ! [[ "$LABEL_NAME" =~ ^B[0-9]+$ ]]; then
            echo "Label is not a build label (B followed by digits) - skipping"
            exit 0
          fi
          if ! [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ && "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid repository or issue number" >&2
            exit 1
          fi

          # Extract org from repository
          org="${REPOSITORY%%/*}"

          # Add to build project and set project-level Product field
          # --set-sprint-if-backlog: also set current sprint if sprint-backlog is already on the issue
          # --config: also set the Product single-select field on the project item
          python3 .github/scripts/project_automation.py \
            add-to-build-project \
            --repository "$REPOSITORY" \
            --issue-number "$ISSUE_NUMBER" \
            --org "$org" \
            --label "$LABEL_NAME" \
            --set-sprint-if-backlog \
            --config conf/pds-products.yaml

      - name: Add to sprint when sprint-backlog label added
        if: inputs.action == 'labeled' && inputs.label_name == 'sprint-backlog'
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
          REPOSITORY: ${{ inputs.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          if ! [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ && "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid repository or issue number" >&2
            exit 1
          fi

          # Extract org from repository
          org="${REPOSITORY%%/*}"

          # Run Python automation script
          python3 .github/scripts/project_automation.py \
            add-to-sprint \
            --repository "$REPOSITORY" \
            --issue-number "$ISSUE_NUMBER" \
            --org "$org"

      - name: Remove from sprint when sprint-backlog label removed
        if: inputs.action == 'unlabeled' && inputs.label_name == 'sprint-backlog'
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
          REPOSITORY: ${{ inputs.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          if ! [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ && "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid repository or issue number" >&2
            exit 1
          fi

          # Extract org from repository
          org="${REPOSITORY%%/*}"

          # Run Python automation script
          python3 .github/scripts/project_automation.py \
            remove-from-sprint \
            --repository "$REPOSITORY" \
            --issue-number "$ISSUE_NUMBER" \
            --org "$org"

      - name: Remove from build project when build label removed
        if: inputs.action == 'unlabeled' && startsWith(inputs.label_name, 'B') && inputs.label_name != 'bug'
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
          REPOSITORY: ${{ inputs.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          LABEL_NAME: ${{ inputs.label_name }}
        run: |
          # Only build labels (B followed by digits) are processed; mirrors BUILD_LABEL_RE
          # in project_automation.py. Anything else is ignored, as the script would do.
          if ! [[ "$LABEL_NAME" =~ ^B[0-9]+$ ]]; then
            echo "Label is not a build label (B followed by digits) - skipping"
            exit 0
          fi
          if ! [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ && "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid repository or issue number" >&2
            exit 1
          fi

          org="${REPOSITORY%%/*}"

          python3 .github/scripts/project_automation.py \
            remove-from-build-project \
            --repository "$REPOSITORY" \
            --issue-number "$ISSUE_NUMBER" \
            --org "$org" \
            --label "$LABEL_NAME"
